[workspace]
members = ["."]

[package]
name = "bulldog-bootloader"
version = "0.1.0"
edition = "2021"

[dependencies]
uefi = { git = "https://github.com/rust-osdev/uefi-rs", features = ["panic_handler", "logger"] }

log = "0.4"
boot-proto = { path = "../boot-proto" }

[[bin]]
name = "bulldog-bootloader"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

